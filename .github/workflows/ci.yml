name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ci:
    name: cargo xtask ci (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev mesa-vulkan-drivers xvfb
      - name: cargo xtask ci
        shell: bash
        run: cargo xtask ci 2>&1 | tee -a "$RUNNER_TEMP/job.log"
      - name: Release build and smoke test
        shell: bash
        run: |
          {
            cargo build --release -p inkra -p inkra-cli --locked
            ./target/release/inkra --version
            ./target/release/inkra-cli --version
          } 2>&1 | tee -a "$RUNNER_TEMP/job.log"
      - name: Startup measurement (Linux, Xvfb + lavapipe)
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run -a ./target/release/inkra --measure-startup --config "$RUNNER_TEMP/inkra" 2>&1 | tee -a "$RUNNER_TEMP/job.log"
      - name: Bundle macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: cargo xtask bundle-macos --release 2>&1 | tee -a "$RUNNER_TEMP/job.log"
      # Job logs need a GitHub sign-in; the summary and annotations do not.
      - name: Publish the failure log
        if: failure()
        shell: bash
        run: bash .github/scripts/failure-summary.sh "$RUNNER_TEMP/job.log"

  bench:
    name: benchmarks (NF-001)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Same-runner A/B: the reference is measured on this machine from the
      # base commit, then the head is compared with it. A reference from another
      # shared runner is too noisy for a 20 % threshold.
      - name: Reference from the base commit
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE=$(git rev-parse HEAD~1)
          fi
          echo "reference: $BASE"
          git worktree add "$RUNNER_TEMP/base" "$BASE"
          cd "$RUNNER_TEMP/base"
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" cargo xtask bench --save 2>&1 | tee -a "$RUNNER_TEMP/job.log"
      - name: Compare the head (fails on > 20 % regression at p95)
        shell: bash
        run: cargo xtask bench 2>&1 | tee -a "$RUNNER_TEMP/job.log"
      - name: Publish the failure log
        if: failure()
        shell: bash
        run: bash .github/scripts/failure-summary.sh "$RUNNER_TEMP/job.log"

  dist:
    name: packages (${{ matrix.os }})
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev rpm
      - name: cargo xtask dist
        shell: bash
        run: cargo xtask dist 2>&1 | tee -a "$RUNNER_TEMP/job.log"
      - name: Publish the failure log
        if: failure()
        shell: bash
        run: bash .github/scripts/failure-summary.sh "$RUNNER_TEMP/job.log"
      - uses: actions/upload-artifact@v4
        with:
          name: inkra-${{ matrix.os }}
          path: target/dist/*
