# cargo-deny (T4): `cargo deny check` runs in CI.
#
# Licenses: the allow list is AGENT.md section 4 rule 4 (MIT, Apache-2.0, BSD,
# ISC, OFL (fonts, not crates), Zlib, Unicode, and since 2026-10-14 BSL-1.0,
# CC0-1.0, CDLA-Permissive-2.0 and MPL-2.0). MPL-2.0 is allowed only for crates
# linked unmodified, so each MPL crate is still listed below and a new one fails
# CI until it is reviewed.

[graph]
all-features = false

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]

exceptions = [
    # SPEC 2.1 names both (fuzzy search, spell checking); linked unmodified.
    { allow = ["MPL-2.0"], crate = "nucleo-matcher" },
    { allow = ["MPL-2.0"], crate = "spellbook" },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
# Workspace path dependencies have no version; registry deps are reviewed in
# xtask/src/deps.rs.
wildcards = "allow"

[advisories]
# Vulnerabilities and yanked versions fail; unmaintained direct dependencies
# fail unless listed here with a reason.
unmaintained = "workspace"
yanked = "deny"
ignore = [
    # ttf-parser is unmaintained (no vulnerability). inkra-math and
    # inkra-diagram read the OpenType MATH table and glyph outlines with it;
    # moving to skrifa (already in the tree via krilla) is T9 in AGENT.md.
    { id = "RUSTSEC-2026-0192", reason = "unmaintained, no known vulnerability; replacement is T9 (AGENT.md), required before 1.0" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
