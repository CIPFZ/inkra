# cargo-deny (T4): `cargo deny check` runs in CI.
#
# Licenses: the allow list is AGENT.md section 4 rule 4 (MIT, Apache-2.0, BSD,
# ISC, OFL (fonts, not crates), Zlib, Unicode). Crates only available under another
# license are listed one by one below with the reason they are acceptable, so
# that any new one fails CI and gets reviewed.

[graph]
all-features = false

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]

exceptions = [
    # SPEC 2.1 names both (fuzzy search, spell checking). MPL-2.0 is file-level
    # copyleft: Inkra does not modify their files and links them unchanged.
    { allow = ["MPL-2.0"], crate = "nucleo-matcher" },
    { allow = ["MPL-2.0"], crate = "spellbook" },
    # Boost Software License 1.0: permissive (arboard's Windows clipboard).
    { allow = ["BSL-1.0"], crate = "clipboard-win" },
    { allow = ["BSL-1.0"], crate = "error-code" },
    # CC0-1.0: public-domain dedication (SPEC 2.1 file watching).
    { allow = ["CC0-1.0"], crate = "notify" },
    # Mozilla's root certificate data for the update check (NF-009).
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs" },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
# Workspace path dependencies have no version; registry deps are reviewed in
# xtask/src/deps.rs.
wildcards = "allow"

[advisories]
# Vulnerabilities and yanked versions fail; unmaintained direct dependencies
# fail unless listed here with a reason.
unmaintained = "workspace"
yanked = "deny"
ignore = [
    # ttf-parser is unmaintained (no vulnerability). inkra-math and
    # inkra-diagram read the OpenType MATH table and glyph outlines with it;
    # moving to skrifa (already in the tree via krilla) is on the ROADMAP.
    { id = "RUSTSEC-2026-0192", reason = "unmaintained, no known vulnerability; replacement planned" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
