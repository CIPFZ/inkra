[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/inkra-app/inkra"
authors = ["Inkra contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[workspace.dependencies]
# internal
inkra-text = { path = "crates/inkra-text" }
inkra-markdown = { path = "crates/inkra-markdown" }
inkra-doc = { path = "crates/inkra-doc" }
inkra-highlight = { path = "crates/inkra-highlight" }
inkra-math = { path = "crates/inkra-math" }
inkra-diagram = { path = "crates/inkra-diagram" }
inkra-html = { path = "crates/inkra-html" }
inkra-layout = { path = "crates/inkra-layout" }
inkra-render = { path = "crates/inkra-render" }
inkra-export = { path = "crates/inkra-export" }
inkra-workspace = { path = "crates/inkra-workspace" }
inkra-engine = { path = "crates/inkra-engine" }
inkra-ui = { path = "crates/inkra-ui" }
inkra-i18n = { path = "crates/inkra-i18n" }

# third party (see xtask/src/deps.rs for the reviewed allowlist)
egui = "0.36"
winit = { version = "0.30", default-features = false }
epaint = "0.36"
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
serde = { version = "1", features = ["derive"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
serde_json = { version = "1", features = ["preserve_order"] }
log = "0.4"
fern = "0.7"
fluent-bundle = "0.16"
unic-langid = "0.9"
sys-locale = "0.3"
thiserror = "2"
anyhow = "1"
tempfile = "3"
ropey = { version = "1.6", default-features = false, features = ["simd", "cr_lines"] }
unicode-segmentation = "1.12"
unicode-width = "0.2"
html5ever = "0.39"
markup5ever_rcdom = "0.39"
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy", "parsing"] }
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }
encoding_rs = "0.8"
proptest = "1"
criterion = { version = "0.8", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
nucleo-matcher = "0.3"
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "_ring", "platform-verifier", "gzip"] }
krilla = { version = "0.8", default-features = false, features = ["raster-images"] }
resvg = { version = "0.48", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
spellbook = "0.4"
ttf-parser = { version = "0.25", default-features = false, features = ["std", "opentype-layout"] }
tiny-skia-path = "0.12"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
ignore = "0.4"
trash = "5"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
notify-debouncer-mini = { version = "0.7", default-features = false }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
muda = { version = "0.21", default-features = false }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# Code off the typing path is optimized for size (binary budget, SPEC 2.5).
[profile.release.package.naga]
opt-level = "s"
[profile.release.package.krilla]
opt-level = "s"
[profile.release.package.resvg]
opt-level = "s"
[profile.release.package.usvg]
opt-level = "s"
[profile.release.package.html5ever]
opt-level = "s"
[profile.release.package.markup5ever]
opt-level = "s"
[profile.release.package.zbus]
opt-level = "s"
[profile.release.package.accesskit_unix]
opt-level = "s"
[profile.release.package.accesskit_windows]
opt-level = "s"
[profile.release.package.rustls]
opt-level = "s"
[profile.release.package.ring]
opt-level = "s"
[profile.release.package.image]
opt-level = "s"
[profile.release.package.image-webp]
opt-level = "s"
[profile.release.package.zune-jpeg]
opt-level = "s"
[profile.release.package.harfrust]
opt-level = "s"
[profile.release.package.skrifa]
opt-level = "s"
[profile.release.package.read-fonts]
opt-level = "s"
[profile.release.package.subsetter]
opt-level = "s"
[profile.release.package.ureq]
opt-level = "s"
[profile.release.package.ureq-proto]
opt-level = "s"
[profile.release.package.spellbook]
opt-level = "s"
[profile.release.package.fontdb]
opt-level = "s"
[profile.release.package.pdf-writer]
opt-level = "s"
[profile.release.package.gif]
opt-level = "s"
[profile.release.package.png]
opt-level = "s"
[profile.release.package.flate2]
opt-level = "s"
[profile.release.package.miniz_oxide]
opt-level = "s"
[profile.release.package.rustls-platform-verifier]
opt-level = "s"
[profile.release.package.rustls-webpki]
opt-level = "s"
[profile.release.package.xmlwriter]
opt-level = "s"
[profile.release.package.roxmltree]
opt-level = "s"
[profile.release.package.svgtypes]
opt-level = "s"
[profile.release.package.zvariant]
opt-level = "s"
[profile.release.package.async-io]
opt-level = "s"
[profile.release.package.async-executor]
opt-level = "s"

[profile.dev]
# Line tables are enough for backtraces and keep target/ small.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
